name: notifications-test # its own Compose project: never touches the dev database.

services:
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications_test
    ports:
      - "5433:5432" # x:y where x is the port on the host machine and y is the port on the container.
    tmpfs: # tmpfs is a file system that is stored in RAM, and is empty on restart. this is not like volumes.
      - /var/lib/postgresql/data # in RAM: fast, and empty on restart.
    healthcheck:
      # -h localhost: it means the healthcheck will use the host's IP address to connect.
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications_test -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 15