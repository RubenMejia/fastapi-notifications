services:
  db:
    image: postgres:16 
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports:
      - "5432:5432" # HOST:CONTAINER, so the app on the host reaches Postgres at localhost:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata: # named volume, so the data survives container restarts and recreation