services:
  db:
    image: postgres:16 
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports:
      - "5432:5432" # para que se pueda acceder a la base de datos desde el exterior x:y donde x es el puerto de la base de datos y y es el puerto de la maquina host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata: #para que se mantengan los datos de la base de datos